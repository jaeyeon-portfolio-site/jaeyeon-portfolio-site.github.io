<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Project</title>

  <!-- 글꼴 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- 브라우저 탭 아이콘 + 링크를 보낼 때 뜨는 미리보기 (카톡·인스타 DM 등). 그림: images/site/favicon.png, share.jpg -->
  <link rel="icon" type="image/png" href="images/site/favicon.png">
  <link rel="apple-touch-icon" href="images/site/favicon.png">
  <meta name="description" content="Jaeyeon Kim's Portfolio — Animation &amp; Illustration">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Jaeyeon Kim">
  <meta property="og:title" content="Jaeyeon Kim — 2D Animation Artist">
  <meta property="og:description" content="Jaeyeon Kim's Portfolio — Animation &amp; Illustration">
  <meta property="og:url" content="https://jaeyeon-portfolio-site.github.io/">
  <meta property="og:image" content="https://jaeyeon-portfolio-site.github.io/images/site/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="project">

  <!-- 캐릭터 + 메뉴 (js/layout.js 가 채워요) -->
  <div data-site-header></div>

  <!-- 프로젝트 상세 (내용은 content.js 에서 자동으로 채워져요) -->
  <main class="project" data-project>
    <a class="back-link" data-back href="index.html#works">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5 9 12l5.5 5.5"/></svg>
      <span data-back-label>All Works</span>
    </a>

    <header class="project__head">
      <h1 class="project__title">
        <span data-p-title></span>
        <span data-flower="yellow" class="flower--title"></span>
      </h1>
      <dl class="project__meta" data-p-meta></dl>
    </header>

    <div class="project__desc" data-p-desc></div>
    <div class="reel project__video" data-p-video hidden></div>
    <div class="project__images" data-p-images></div>

    <nav class="project__nav" data-p-nav aria-label="다른 프로젝트"></nav>
  </main>

  <!-- 하단 (js/layout.js 가 채워요) -->
  <div data-site-footer></div>

  <script src="content.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
